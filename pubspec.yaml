name: cardo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Geist.txt
    - assets/fonts/OFL-GeistMono.txt
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
